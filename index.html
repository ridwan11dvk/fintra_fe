<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finalink-2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railfinance</title>
    <style>
      /* Boot splash: spinner statis yang tampil SEBELUM bundle JS/CSS selesai dimuat.
         Konten ini otomatis tergantikan saat React mount (createRoot().render()).
         Tidak bergantung pada Tailwind / bundle CSS sama sekali. */
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: #ffffff;
      }
      #root {
        min-height: 100%;
      }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .boot-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-label {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 14px;
        color: #64748b;
        letter-spacing: 0.02em;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <output class="boot-splash" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
      </output>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
