# 1. Identitas Project (Ganti sesuai nama proyek Anda)
sonar.projectKey=fintra_fe
sonar.sourceEncoding=UTF-8

# 2. Lokasi Kode Utama (Source Code)
# Asumsi: folder app, features, layouts, dll berada di dalam folder 'src'
sonar.sources=src

# JIKA ternyata folder app, features, dll tersebut ada di ROOT (sejajar package.json), 
# maka ubah baris di atas menjadi:
# sonar.sources=app,features,layouts,shared,main.tsx

# 3. Pengecualian (Exclusions)
# Kita kecualikan hasil build (dist/build), library, file test, dan CSS murni
# agar tidak merusak metrik coverage dan code smell.
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,.output/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.css,**/*.d.ts,src/main.tsx,src/**/*.handlers.ts,src/**/*.types.ts,src/**/*.nav.ts,src/**/*.schema.ts,src/shared/types/**,src/shared/constants/**,src/app/**,src/**/index.ts,src/**/routes.tsx

# 4. Lokasi File Unit Test
# Arahkan kembali ke folder src, tapi minta Sonar hanya membaca file berakhiran test/spec
sonar.tests=tests/unit
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# 5. Lokasi Laporan Coverage (LCOV)
# Ini adalah standar output dari Jest atau Vitest
sonar.javascript.lcov.reportPaths=.output/tests/coverage/lcov.info